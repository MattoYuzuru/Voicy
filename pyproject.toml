[project]
name = "voicey"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["aiogram==3.31.0", "aiohttp==3.14.5", "python-dotenv==1.2.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
